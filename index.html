<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NYC Citi Bike – CDTA Trip Network</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      height: 100vh;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      background: #141414;
      color: #ccc;
    }

    /* ── Controls panel ── */
    #controls {
      width: 220px;
      flex-shrink: 0;
      background: #1c1c1c;
      border-right: 1px solid #2e2e2e;
      display: flex;
      flex-direction: column;
      padding: 16px 14px;
      gap: 18px;
      overflow-y: auto;
    }

    #controls h1 {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      color: #eee;
    }

    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-group label {
      font-weight: 600;
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    select {
      width: 100%;
      padding: 5px 8px;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      background: #252525;
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
    }
    select:focus { outline: 2px solid #4e79a7; border-color: transparent; }

    .radio-group { display: flex; flex-direction: column; gap: 5px; }
    .radio-group label {
      display: flex; align-items: center; gap: 7px;
      font-size: 13px; font-weight: 400; color: #bbb;
      text-transform: none; letter-spacing: 0;
      cursor: pointer;
    }

    .slider-row { display: flex; align-items: center; gap: 8px; }
    input[type=range] { flex: 1; cursor: pointer; accent-color: #4e79a7; }
    #threshold-val { font-variant-numeric: tabular-nums; white-space: nowrap; color: #999; font-size: 12px; }

    /* ── Stats ── */
    #stats {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid #2e2e2e;
      font-size: 11px;
      color: #666;
      line-height: 1.8;
    }
    #stats strong { color: #aaa; }

    /* ── Legend ── */
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .swatch { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

    /* ── Chart ── */
    #chart-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #chart { width: 100%; height: 100%; display: block; }

    /* ── Map ── */
    #map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      border-left: 1px solid #2e2e2e;
    }
    #map { width: 100%; height: 100%; display: block; }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed;
      display: none;
      background: rgba(0,0,0,.88);
      color: #eee;
      padding: 8px 11px;
      border-radius: 5px;
      font-size: 12px;
      line-height: 1.6;
      pointer-events: none;
      z-index: 10;
      max-width: 220px;
      border: 1px solid #333;
    }
    #tooltip strong { font-size: 13px; }

    /* ── Loading overlay ── */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #666;
      background: #141414;
    }

    hr { border: none; border-top: 1px solid #2e2e2e; }
  </style>
</head>
<body>

<div id="controls">
  <h1>NYC Citi Bike<br>CDTA Trip Network</h1>

  <div class="control-group">
    <label>Month</label>
    <select id="month-sel"></select>
  </div>

  <hr>

  <div class="control-group">
    <label>Node size</label>
    <div class="radio-group">
      <label><input type="radio" name="mode" value="total" checked> Total trips</label>
      <label><input type="radio" name="mode" value="from"> Trips from (departures)</label>
      <label><input type="radio" name="mode" value="to"> Trips to (arrivals)</label>
    </div>
  </div>

  <hr>

  <div class="control-group">
    <label>Min edge trips</label>
    <div class="slider-row">
      <input type="range" id="threshold-slider" min="0" value="0">
      <span id="threshold-val">—</span>
    </div>
  </div>

  <hr>

  <div class="control-group">
    <label>Borough</label>
    <div id="legend"></div>
  </div>

  <div id="stats">
    <div>Edges shown: <strong id="stat-edges">—</strong></div>
    <div>Active nodes: <strong id="stat-nodes">—</strong></div>
  </div>
</div>

<div id="chart-container">
  <div id="loading">Loading network data…</div>
  <svg id="chart"></svg>
</div>

<div id="map-container">
  <svg id="map"></svg>
</div>

<div id="tooltip"></div>

<style>
  /* body is a row flex at 100vh, so a footer cannot be a flex child here
     without becoming a third column -- it is pinned instead. */
  /* Pinned top-right, which is the only genuinely empty corner. A
     full-width bottom bar clipped the node counts in the control panel,
     and a bottom-right pill covered the "Total trips" ramp's max tick. */
  .page-credit {
    position: fixed; right: 0; top: 0; z-index: 50;
    padding: 4px 10px;
    font: 11px/1.35 system-ui, sans-serif;
    color: #8a8a8a; background: rgba(20,20,20,0.88);
    border-bottom-left-radius: 4px;
    pointer-events: none;
  }
  .page-credit a { color: #b9b9b9; pointer-events: auto; }
  .page-credit a:hover { color: #e8e8e8; }
</style>
<footer class="page-credit">
  Data:
  <a href="https://citibikenyc.com/system-data" rel="noopener" target="_blank">Citi Bike System Data</a>.
  Source code and method notes:
  <a href="https://github.com/ssitari/LinkedNetworkGraphChoroplethMap" rel="noopener" target="_blank">ssitari/LinkedNetworkGraphChoroplethMap</a>.
</footer>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="app.js"></script>
</body>
</html>
